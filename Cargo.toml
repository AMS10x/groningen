[package]
name = "groningen"
version = "0.1.0"
edition = "2021"
authors = ["AMS10x"]
description = "High-performance local translation TUI and CLI extension engine"

[dependencies]
# CLI & Terminal
clap = { version = "4.4", features = ["derive", "cargo"] }
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }

# Async & Networking
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
indicatif = "0.17"

# Serialization & System Paths
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
